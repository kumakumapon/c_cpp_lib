name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        config: [Debug, Release]
        tables: [OFF, ON]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DEMBED_CRC_TABLES=${{ matrix.tables }}
      - run: cmake --build build --config ${{ matrix.config }} --parallel 4
      - run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --output-junit results.xml
      - run: cmake --install build --config ${{ matrix.config }} --prefix "${{ github.workspace }}/stage"
      - run: cmake -S tests/install_consumer -B consumer -DCMAKE_PREFIX_PATH="${{ github.workspace }}/stage"
      - run: cmake --build consumer --config ${{ matrix.config }}
      - run: ctest --test-dir consumer -C ${{ matrix.config }} --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}-${{ matrix.config }}-${{ matrix.tables }}
          path: build/results.xml
  sanitizers:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
  shared:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 4
      - run: ctest --test-dir build -C Release --output-on-failure
